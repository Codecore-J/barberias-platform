name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: barberias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Backend)
        working-directory: ./backend-barberias
        run: npm ci

      - name: Install dependencies (Frontend)
        working-directory: ./frontend-barberias
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend-barberias
        run: npx prisma generate

      - name: Run Linter (Backend)
        working-directory: ./backend-barberias
        run: npm run lint

      - name: Run Linter (Frontend)
        working-directory: ./frontend-barberias
        run: npm run lint

      - name: Build Backend
        working-directory: ./backend-barberias
        run: npm run build

      - name: Build Frontend
        working-directory: ./frontend-barberias
        run: npm run build

      - name: Scan for Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Prisma Migrations (Test DB)
        working-directory: ./backend-barberias
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/barberias_test
        run: npx prisma migrate deploy

      - name: Run Unit/Integration Tests (Backend)
        working-directory: ./backend-barberias
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/barberias_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_for_ci_pipeline
        run: npm run test

      - name: Run Tests (Frontend)
        working-directory: ./frontend-barberias
        run: npm run test -- --watch=false --browsers=ChromeHeadless
