services:
  - type: web
    name: barberias-api
    runtime: node
    region: ohio # Co-localizado en AWS us-east-2 con Neon PostgreSQL
    plan: free
    rootDir: backend-barberias
    buildCommand: rm -f ../package.json && npm install --include=dev && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    # H64: sonda de VIDA, no de preparación. `/health` comprueba Base de Datos Y
    # Redis, así que con la cola caída devolvía 503 y Render podía reiniciar en
    # bucle una instancia que estaba sirviendo con normalidad. La preparación
    # (con Redis incluido) sigue disponible en /api/v1/health para alertas y
    # balanceadores: no se usa como `healthCheckPath`.
    healthCheckPath: /api/v1/health/liveness
    autoDeploy: true
    envVars:
      # APP_ENV es obligatorio: `main.ts` aborta el arranque si falta o no es
      # dev/staging/production.
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # El código lee FRONTEND_URL (lista separada por comas) para CORS;
      # `CORS_ORIGINS` no la consume nadie y se elimina del blueprint.
      - key: FRONTEND_URL
        value: https://barberias-platform-git-main-developerstem.vercel.app,https://barberias-platform.vercel.app
