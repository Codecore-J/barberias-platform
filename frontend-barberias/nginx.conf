# nginx · SPA Angular (Paso 17)
#
# Servido como /etc/nginx/conf.d/default.conf dentro de la imagen nginx:alpine.
# Todo lo que nginx no encuentra en disco cae a index.html para que el router
# de Angular maneje la ruta (history URL strategy).
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Runtime config: se REESCRIBE en cada arranque del contenedor (entrypoint)
    # con la API_URL real, así que jamás puede quedar cacheado en el navegador.
    location = /assets/env.js {
        add_header Cache-Control "no-store";
    }

    # El index nunca se cachea: es lo que porta los hashes de los bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash de salida (outputHashing: all) → caché agresiva e inocua.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: rutas de Angular como /admin/analytics resuelven a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}